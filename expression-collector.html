<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표현 채집장</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F1EEE1;
  --paper-dark:#E7E0CC;
  --card:#FBF9F1;
  --ink:#26312B;
  --ink-soft:#6B7268;
  --sage:#5B7B5E;
  --sage-dark:#3E5940;
  --ochre:#C98D2E;
  --rust:#A64B3B;
  --line:#D9D2BB;
  --white:#FFFDF7;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'IBM Plex Sans KR', sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--paper-dark) 1px, transparent 1px);
  background-size: 100% 2.2em;
  background-position: 0 5.6em;
}

#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* HEADER */
.app-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:22px 20px 14px;
  border-bottom:2px solid var(--ink);
  background:var(--paper);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{font-size:26px; line-height:1;}
.brand h1{
  font-family:'Fraunces', serif;
  font-size:22px;
  font-weight:600;
  letter-spacing:-0.01em;
}
.tagline{
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:2px;
}
.entry-count{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  text-align:right;
  white-space:nowrap;
}
.entry-count span{color:var(--sage-dark); font-weight:600;}

/* LANGUAGE LANES */
.lang-tabs{
  display:flex;
  gap:5px;
  padding:10px 16px 0;
  background:var(--paper);
}
.lang-tab{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  white-space:nowrap;
  padding:8px 13px 7px;
  border:1.3px solid var(--ink);
  border-bottom:none;
  border-radius:7px 7px 0 0;
  background:var(--paper-dark);
  color:var(--ink-soft);
  cursor:pointer;
  position:relative;
  top:1px;
  box-shadow:1px -1px 0 var(--line) inset;
}
.lang-tab.active{
  background:var(--card);
  color:var(--ink);
  font-weight:600;
}
.lang-tab.active[data-lang="en"]{box-shadow:inset 0 3px 0 0 var(--sage-dark);}
.lang-tab.active[data-lang="ja"]{box-shadow:inset 0 3px 0 0 var(--rust);}
.lang-tab.active[data-lang="es"]{box-shadow:inset 0 3px 0 0 var(--ochre);}
.lang-tab-strip{
  height:1.5px;
  background:var(--ink);
  margin:0 0 0;
}
.lang-pill{
  font-family:'IBM Plex Mono', monospace;
  font-size:9.5px;
  letter-spacing:0.02em;
  padding:2px 7px;
  border-radius:10px;
  border:1px solid var(--line);
  color:var(--ink-soft);
}

/* MAIN */
main{flex:1; padding:18px 16px 100px; overflow-y:auto;}

/* TAB BAR */
.tab-bar{
  position:fixed;
  bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:520px;
  display:flex;
  background:var(--white);
  border-top:2px solid var(--ink);
  z-index:20;
}
.tab-bar button{
  flex:1;
  padding:13px 0 11px;
  background:none; border:none;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  letter-spacing:0.02em;
  color:var(--ink-soft);
  cursor:pointer;
  border-top:2px solid transparent;
  margin-top:-2px;
  transition:color .15s;
}
.tab-bar button.active{
  color:var(--sage-dark);
  font-weight:600;
  border-top-color:var(--sage-dark);
}

/* CAPTURE FORM */
.capture-card{
  background:var(--card);
  border:1.5px solid var(--ink);
  border-radius:2px;
  padding:20px 18px;
  box-shadow:3px 3px 0 var(--line);
}
.field-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:0.06em;
  color:var(--sage-dark);
  text-transform:uppercase;
  margin-bottom:6px;
  display:block;
}
textarea.main-input{
  width:100%;
  font-family:'Fraunces', serif;
  font-size:19px;
  font-weight:500;
  line-height:1.4;
  border:none;
  border-bottom:1.5px solid var(--line);
  background:transparent;
  resize:none;
  padding:4px 0 10px;
  color:var(--ink);
}
textarea.main-input:focus{outline:none; border-bottom-color:var(--sage-dark);}
.type-row{display:flex; gap:8px; margin:16px 0 14px;}
.type-chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  padding:6px 12px;
  border:1.3px solid var(--ink);
  border-radius:20px;
  background:var(--white);
  cursor:pointer;
  color:var(--ink-soft);
}
.type-chip.active{background:var(--sage-dark); color:var(--white); border-color:var(--sage-dark);}
input.meaning-input{
  width:100%;
  font-family:'IBM Plex Sans KR', sans-serif;
  font-size:14.5px;
  border:none;
  border-bottom:1.5px solid var(--line);
  background:transparent;
  padding:6px 0 8px;
  color:var(--ink);
  margin-bottom:18px;
}
input.meaning-input:focus{outline:none; border-bottom-color:var(--sage-dark);}
.save-btn{
  width:100%;
  padding:13px 0;
  background:var(--sage-dark);
  color:var(--white);
  border:none;
  border-radius:2px;
  font-family:'IBM Plex Sans KR', sans-serif;
  font-weight:600;
  font-size:14.5px;
  cursor:pointer;
}
.save-btn:active{transform:translateY(1px);}
.save-btn:disabled{background:var(--ink-soft); cursor:not-allowed;}

.hint-box{
  margin-top:16px;
  font-size:12px;
  color:var(--ink-soft);
  line-height:1.6;
  padding:12px 14px;
  border-left:2px solid var(--ochre);
  background:rgba(201,141,46,0.07);
}

/* JOURNAL LIST */
.journal-empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-soft);
  font-size:13.5px;
  line-height:1.7;
}
.entry-card{
  background:var(--card);
  border:1.3px solid var(--ink);
  border-radius:2px;
  padding:14px 14px 12px;
  margin-bottom:12px;
  cursor:pointer;
  box-shadow:2px 2px 0 var(--line);
  transition:box-shadow .12s, transform .12s;
}
.entry-card:active{box-shadow:0 0 0 var(--line); transform:translate(2px,2px);}
.entry-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.entry-text{
  font-family:'Fraunces', serif;
  font-size:16.5px;
  font-weight:500;
  line-height:1.35;
}
.entry-meta{
  display:flex; align-items:center; gap:8px;
  margin-top:8px;
}
.tag-pill{
  font-family:'IBM Plex Mono', monospace;
  font-size:9.5px;
  letter-spacing:0.04em;
  padding:2px 7px;
  border-radius:10px;
  border:1px solid var(--line);
  color:var(--ink-soft);
  text-transform:uppercase;
}
.entry-meaning{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:6px;
}

/* GROWTH RINGS */
.rings{flex-shrink:0;}
.rings svg{display:block;}

/* WORDBOOK */
.wb-controls{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px;
}
.wb-filter{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
}
.wb-progress{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--sage-dark);
}
.flashcard{
  background:var(--card);
  border:1.5px solid var(--ink);
  border-radius:3px;
  min-height:220px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:30px 22px;
  text-align:center;
  box-shadow:4px 4px 0 var(--line);
  cursor:pointer;
  position:relative;
}
.flashcard .tag-pill{position:absolute; top:12px; left:12px;}
.fc-front{
  font-family:'Fraunces', serif;
  font-size:23px;
  font-weight:600;
  line-height:1.4;
}
.fc-back{
  font-size:15px;
  color:var(--sage-dark);
  font-weight:600;
  line-height:1.6;
}
.fc-hint{
  margin-top:16px;
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color:var(--ink-soft);
}
.wb-secondary-row{display:flex; justify-content:center; gap:14px; margin-top:20px;}
.verdict-bar{
  display:flex;
  align-items:stretch;
  margin-top:14px;
  border:1.5px solid var(--ink);
  border-radius:4px;
  overflow:hidden;
  box-shadow:3px 3px 0 var(--line);
}
.verdict-half{
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:5px;
  padding:16px 0 13px;
  border:none;
  cursor:pointer;
  background:var(--white);
  transition:background .12s, transform .1s;
}
.verdict-half:active{transform:translateY(1px);}
.verdict-half.not-yet{color:var(--rust);}
.verdict-half.not-yet:hover{background:rgba(166,75,59,0.07);}
.verdict-half.got-it{color:var(--sage-dark);}
.verdict-half.got-it:hover{background:rgba(91,123,94,0.07);}
.verdict-icon{
  width:26px; height:26px;
  border-radius:50%;
  border:1.5px solid currentColor;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces', serif;
  font-size:14px;
  font-weight:600;
}
.verdict-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:0.05em;
  text-transform:uppercase;
}
.verdict-divider{width:1.5px; background:var(--ink);}
.memorized-pill{
  position:absolute; top:12px; right:12px;
  font-family:'IBM Plex Mono', monospace;
  font-size:9.5px;
  padding:3px 8px;
  border-radius:10px;
  letter-spacing:0.03em;
}
.memorized-pill.yes{background:rgba(91,123,94,0.14); color:var(--sage-dark); border:1px solid var(--sage-dark);}
.memorized-pill.no{background:rgba(166,75,59,0.1); color:var(--rust); border:1px solid var(--rust);}
.entry-check{
  font-size:13px;
  margin-top:8px;
}

/* OVERLAY / DETAIL */
.overlay{
  position:fixed; inset:0;
  background:rgba(38,49,43,0.45);
  z-index:50;
  display:flex; align-items:flex-end;
  max-width:520px; margin:0 auto;
}
.overlay.hidden{display:none;}
.sheet{
  background:var(--paper);
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  border-radius:14px 14px 0 0;
  border-top:2px solid var(--ink);
  padding:18px 18px 30px;
  animation:slideUp .18s ease-out;
}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
.sheet-close{
  background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; padding:2px 6px;
}
.detail-text{
  font-family:'Fraunces', serif;
  font-size:24px;
  font-weight:600;
  line-height:1.35;
  margin-bottom:6px;
}
.audio-row{display:flex; gap:10px; margin:16px 0;}
.round-btn{
  width:46px; height:46px;
  border-radius:50%;
  border:1.5px solid var(--ink);
  background:var(--white);
  font-size:18px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.round-btn.rec{border-color:var(--rust); color:var(--rust);}
.round-btn.rec.recording{background:var(--rust); color:var(--white); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(166,75,59,0.4);} 50%{box-shadow:0 0 0 8px rgba(166,75,59,0);}}
.audio-status{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  display:flex; align-items:center;
}
audio{height:36px; max-width:100%;}

.section-block{margin-top:20px;}
.section-title{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:0.06em;
  color:var(--sage-dark);
  text-transform:uppercase;
  margin-bottom:8px;
  display:flex; align-items:center; gap:8px;
}
.section-title::after{content:''; flex:1; height:1px; background:var(--line);}
.meaning-edit{
  width:100%;
  font-size:14.5px;
  border:none;
  border-bottom:1.5px solid var(--line);
  background:transparent;
  padding:6px 0;
}
.meaning-edit:focus{outline:none; border-bottom-color:var(--sage-dark);}

.note-item{
  background:var(--card);
  border:1px solid var(--line);
  border-left:3px solid var(--ochre);
  padding:10px 12px;
  border-radius:2px;
  margin-bottom:8px;
  font-size:13.5px;
  line-height:1.5;
}
.note-date{
  font-family:'IBM Plex Mono', monospace;
  font-size:9.5px;
  color:var(--ink-soft);
  margin-top:4px;
  display:block;
}
.add-note-row{display:flex; gap:8px; margin-top:6px;}
.add-note-row input{
  flex:1;
  font-size:13.5px;
  border:1.3px solid var(--line);
  border-radius:2px;
  padding:9px 10px;
  background:var(--white);
}
.add-note-row input:focus{outline:none; border-color:var(--sage-dark);}
.add-note-row button{
  padding:0 16px;
  border:1.3px solid var(--ink);
  background:var(--ink);
  color:var(--white);
  border-radius:2px;
  font-size:13px;
  cursor:pointer;
}

.rings-large{display:flex; justify-content:center; margin:6px 0 4px;}
.stage-label{
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  margin-bottom:10px;
}

.danger-zone{margin-top:26px; text-align:center;}
.delete-link{
  background:none; border:none;
  color:var(--rust);
  font-size:12px;
  font-family:'IBM Plex Mono', monospace;
  cursor:pointer;
  text-decoration:underline;
}

.toast{
  position:fixed; bottom:76px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--white);
  padding:9px 18px; border-radius:20px;
  font-size:12.5px;
  z-index:100;
  opacity:0; pointer-events:none;
  transition:opacity .2s;
}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">🌿</span>
      <div>
        <h1>표현 채집장</h1>
        <p class="tagline">좋은 문장을 채집하고, 천천히 살을 붙여보세요</p>
      </div>
    </div>
    <div class="entry-count">No. <span id="entryCount">000</span></div>
  </header>
  <nav class="lang-tabs" id="langTabs">
    <button class="lang-tab" data-lang="en">🇬🇧 영어</button>
    <button class="lang-tab" data-lang="ja">🇯🇵 일본어</button>
    <button class="lang-tab" data-lang="es">🇪🇸 스페인어</button>
  </nav>
  <div class="lang-tab-strip"></div>
  <main id="mainView"></main>
  <nav class="tab-bar" id="tabBar">
    <button data-tab="capture">채집</button>
    <button data-tab="journal">노트</button>
    <button data-tab="wordbook">단어장</button>
  </nav>
</div>
<div id="detailOverlay" class="overlay hidden"></div>
<div id="toast" class="toast"></div>

<script>
// ---------- STATE ----------
let state = {
  tab: 'capture',
  entries: [],
  loading: true,
  captureType: 'expression',
  activeLang: 'en',
  draftText: '',
  draftMeaning: '',
  wbIndex: 0,
  wbFlipped: false,
  wbFilter: 'all',
  wbStatusFilter: 'all',
  detailId: null,
  isRecording: false,
};
let mediaRecorder = null;
let recChunks = [];

const TYPE_LABELS = { word: '단어', expression: '표현', sentence: '문장' };
const LANG_META = {
  en: { label: '영어', flag: '🇬🇧', code: 'en-US' },
  ja: { label: '일본어', flag: '🇯🇵', code: 'ja-JP' },
  es: { label: '스페인어', flag: '🇪🇸', code: 'es-ES' },
};
function langMeta(entry){ return LANG_META[entry.lang] || LANG_META.en; }

// ---------- STORAGE HELPERS ----------
async function loadEntries(){
  try{
    const list = await window.storage.list('entry:', false);
    const keys = (list && list.keys) ? list.keys : [];
    const results = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, false);
        if(r && r.value) results.push(JSON.parse(r.value));
      }catch(e){ /* skip broken key */ }
    }
    results.sort((a,b)=> b.createdAt - a.createdAt);
    state.entries = results;
  }catch(e){
    console.error('load error', e);
  }
  state.loading = false;
  render();
}

async function saveEntry(entry){
  await window.storage.set('entry:' + entry.id, JSON.stringify(entry), false);
}

async function deleteEntryStorage(id){
  await window.storage.delete('entry:' + id, false);
}

// ---------- UTIL ----------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}
function stageOf(entry){
  let s = 1;
  if(entry.meaning && entry.meaning.trim()) s = 2;
  if(entry.notes && entry.notes.length > 0) s = 3;
  if(entry.recording) s = 4;
  return s;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}
function ringsSVG(stage, size){
  size = size || 34;
  const c = size/2;
  const colors = ['#D9D2BB', '#C98D2E', '#5B7B5E', '#26312B'];
  let circles = '';
  for(let i=0;i<4;i++){
    const r = 3 + i*4.2;
    const filled = i < stage;
    circles += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${filled?colors[i]:'#E7E0CC'}" stroke-width="${filled?2:1}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>`;
}

function speak(text, langCode){
  if(!('speechSynthesis' in window)){ showToast('이 브라우저는 음성 합성을 지원하지 않아요'); return; }
  langCode = langCode || 'en-US';
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langCode;
  u.rate = 0.92;
  const voices = speechSynthesis.getVoices();
  const prefix = langCode.split('-')[0];
  const match = voices.find(v=>v.lang && v.lang.startsWith(prefix));
  if(match) u.voice = match;
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{};
}

// ---------- RECORDING ----------
async function startRecording(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result;
        const entry = state.entries.find(e=>e.id === state.detailId);
        if(entry){
          entry.recording = base64;
          await saveEntry(entry);
          render();
          showToast('녹음이 저장되었어요');
        }
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    state.isRecording = true;
    render();
  }catch(err){
    showToast('마이크 접근 권한이 필요해요');
  }
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder.stop();
  }
  state.isRecording = false;
  render();
}

// ---------- ACTIONS ----------
async function handleAddEntry(){
  const text = state.draftText.trim();
  if(!text) return;
  const entry = {
    id: uid(),
    text,
    type: state.captureType,
    lang: state.activeLang,
    meaning: state.draftMeaning.trim(),
    notes: [],
    recording: null,
    memorized: false,
    createdAt: Date.now(),
  };
  state.entries.unshift(entry);
  await saveEntry(entry);
  state.draftText = '';
  state.draftMeaning = '';
  showToast('채집 완료 🌱');
  render();
}

async function handleDeleteEntry(id){
  if(!confirm('이 표현을 삭제할까요? 되돌릴 수 없어요.')) return;
  state.entries = state.entries.filter(e=>e.id !== id);
  await deleteEntryStorage(id);
  closeDetail();
  render();
}

async function handleAddNote(id){
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if(!text) return;
  const entry = state.entries.find(e=>e.id === id);
  if(!entry) return;
  entry.notes = entry.notes || [];
  entry.notes.push({ id: uid(), text, createdAt: Date.now() });
  await saveEntry(entry);
  input.value = '';
  render();
}

async function handleMeaningEdit(id, value){
  const entry = state.entries.find(e=>e.id === id);
  if(!entry) return;
  entry.meaning = value;
  await saveEntry(entry);
}

async function toggleDetailMemorized(id){
  const entry = state.entries.find(e=>e.id === id);
  if(!entry) return;
  entry.memorized = !entry.memorized;
  await saveEntry(entry);
  render();
}

function openDetail(id){
  state.detailId = id;
  render();
}
function closeDetail(){
  state.detailId = null;
  state.isRecording = false;
  render();
}

// ---------- RENDER: TABS ----------
function renderCapture(){
  const placeholders = { en: "e.g. It's not rocket science.", ja: '例：お疲れ様です', es: 'p.ej. No hay de qué' };
  return `
    <div class="capture-card">
      <label class="field-label">${LANG_META[state.activeLang].flag} ${LANG_META[state.activeLang].label} 표현 채집 중</label>
      <textarea id="captureInput" class="main-input" rows="3" placeholder="${placeholders[state.activeLang]}" oninput="state.draftText=this.value">${escapeHtml(state.draftText)}</textarea>
      <div class="type-row">
        ${['word','expression','sentence'].map(t=>`
          <button class="type-chip ${state.captureType===t?'active':''}" onclick="setCaptureType('${t}')">${TYPE_LABELS[t]}</button>
        `).join('')}
      </div>
      <label class="field-label">뜻 (선택)</label>
      <input id="captureMeaning" class="meaning-input" placeholder="한국어 의미를 적어보세요" value="${escapeAttr(state.draftMeaning)}" oninput="state.draftMeaning=this.value">
      <button class="save-btn" onclick="handleAddEntry()">채집장에 담기</button>
    </div>
    <div class="hint-box">
      💡 일단 문장만 던져놔도 괜찮아요. 나중에 노트에서 발음을 듣고, 직접 녹음하고, 예문과 뉘앙스를 하나씩 붙여가며 표현을 키워보세요. 언어는 상단 탭에서 바꿀 수 있어요.
    </div>
  `;
}

function renderJournal(){
  const list = state.entries.filter(e => (e.lang||'en') === state.activeLang);
  if(list.length === 0){
    return `<div class="journal-empty">아직 채집한 표현이 없어요.<br>‘채집’ 탭에서 첫 표현을 담아보세요 🌱</div>`;
  }
  return list.map(entry => `
    <div class="entry-card" onclick="openDetail('${entry.id}')">
      <div class="entry-card-top">
        <div>
          <div class="entry-text">${escapeHtml(entry.text)}</div>
          <div class="entry-meta">
            <span class="lang-pill">${langMeta(entry).flag} ${langMeta(entry).label}</span>
            <span class="tag-pill">${TYPE_LABELS[entry.type]}</span>
            <span class="tag-pill">${fmtDate(entry.createdAt)}</span>
            <span class="tag-pill" style="${entry.memorized ? 'color:var(--sage-dark);border-color:var(--sage-dark);' : 'color:var(--rust);border-color:var(--rust);'}">${entry.memorized ? '✓ 암기' : '미암기'}</span>
          </div>
          ${entry.meaning ? `<div class="entry-meaning">${escapeHtml(entry.meaning)}</div>` : ''}
        </div>
        <div class="rings">${ringsSVG(stageOf(entry))}</div>
      </div>
    </div>
  `).join('');
}

function getWordbookList(){
  let list = state.entries.filter(e => (e.lang||'en') === state.activeLang);
  if(state.wbStatusFilter === 'unmemorized') list = list.filter(e=>!e.memorized);
  else if(state.wbStatusFilter === 'memorized') list = list.filter(e=>e.memorized);
  if(state.wbFilter !== 'all') list = list.filter(e=>e.type === state.wbFilter);
  return list;
}

function renderWordbook(){
  const list = getWordbookList();
  const laneEntries = state.entries.filter(e => (e.lang||'en') === state.activeLang);
  const totalCount = laneEntries.length;
  const memorizedCount = laneEntries.filter(e=>e.memorized).length;
  const statsLine = `<div class="wb-progress">✓ ${memorizedCount} / ${totalCount} 암기</div>`;

  if(list.length === 0){
    return `
      <div class="wb-controls">
        <div class="wb-filter">${wbFilterSelect()} ${wbStatusSelect()}</div>
      </div>
      <div class="journal-empty">이 조건에 맞는 표현이 아직 없어요.</div>
    `;
  }
  if(state.wbIndex >= list.length) state.wbIndex = 0;
  const entry = list[state.wbIndex];
  return `
    <div class="wb-controls">
      <div class="wb-filter">${wbFilterSelect()} ${wbStatusSelect()}</div>
      ${statsLine}
    </div>
    <div class="flashcard" onclick="toggleFlip()">
      <span class="tag-pill">${langMeta(entry).flag} ${TYPE_LABELS[entry.type]}</span>
      <span class="memorized-pill ${entry.memorized ? 'yes' : 'no'}">${entry.memorized ? '✓ 암기함' : '미암기'}</span>
      ${state.wbFlipped
        ? `<div class="fc-back">${entry.meaning ? escapeHtml(entry.meaning) : '(등록된 뜻이 없어요)'}</div>`
        : `<div class="fc-front">${escapeHtml(entry.text)}</div>`
      }
      <div class="fc-hint">탭해서 ${state.wbFlipped?'표현':'뜻'} 보기 · ${state.wbIndex+1} / ${list.length}</div>
    </div>
    <div class="wb-secondary-row">
      <button class="round-btn" onclick="speak('${escapeAttr(entry.text)}', '${langMeta(entry).code}')" title="발음 듣기">🔊</button>
      <button class="round-btn" onclick="wbNext()" title="건너뛰기">⏭</button>
    </div>
    <div class="verdict-bar">
      <button class="verdict-half not-yet" onclick="markMemorized('${entry.id}', false)">
        <span class="verdict-icon">✕</span>
        <span class="verdict-label">아직이에요</span>
      </button>
      <div class="verdict-divider"></div>
      <button class="verdict-half got-it" onclick="markMemorized('${entry.id}', true)">
        <span class="verdict-icon">✓</span>
        <span class="verdict-label">외웠어요</span>
      </button>
    </div>
  `;
}
function wbFilterSelect(){
  return `
    <select onchange="setWbFilter(this.value)" style="font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--white);">
      <option value="all" ${state.wbFilter==='all'?'selected':''}>전체 유형</option>
      <option value="word" ${state.wbFilter==='word'?'selected':''}>단어</option>
      <option value="expression" ${state.wbFilter==='expression'?'selected':''}>표현</option>
      <option value="sentence" ${state.wbFilter==='sentence'?'selected':''}>문장</option>
    </select>
  `;
}
function wbStatusSelect(){
  return `
    <select onchange="setWbStatusFilter(this.value)" style="font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--white);margin-left:6px;">
      <option value="all" ${state.wbStatusFilter==='all'?'selected':''}>전체</option>
      <option value="unmemorized" ${state.wbStatusFilter==='unmemorized'?'selected':''}>안 외운 것</option>
      <option value="memorized" ${state.wbStatusFilter==='memorized'?'selected':''}>외운 것</option>
    </select>
  `;
}
function setWbFilter(v){ state.wbFilter = v; state.wbIndex = 0; state.wbFlipped = false; render(); }
function setWbStatusFilter(v){ state.wbStatusFilter = v; state.wbIndex = 0; state.wbFlipped = false; render(); }
function toggleFlip(){ state.wbFlipped = !state.wbFlipped; render(); }
function wbNext(){
  const list = getWordbookList();
  state.wbIndex = (state.wbIndex + 1) % Math.max(list.length,1);
  state.wbFlipped = false;
  render();
}
async function markMemorized(id, value){
  const entry = state.entries.find(e=>e.id === id);
  if(!entry) return;
  entry.memorized = value;
  await saveEntry(entry);
  // move to next card in current filtered list
  const list = getWordbookList();
  if(list.length === 0){ state.wbIndex = 0; }
  else { state.wbIndex = state.wbIndex % list.length; }
  state.wbFlipped = false;
  render();
}

// ---------- RENDER: DETAIL SHEET ----------
function renderDetail(){
  const overlay = document.getElementById('detailOverlay');
  if(!state.detailId){
    overlay.classList.add('hidden');
    overlay.innerHTML = '';
    return;
  }
  const entry = state.entries.find(e=>e.id === state.detailId);
  if(!entry){ overlay.classList.add('hidden'); return; }
  overlay.classList.remove('hidden');
  const stage = stageOf(entry);
  const stageLabels = ['채집됨','뜻 추가됨','예문/메모 추가됨','발음까지 완성'];

  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-header">
        <span class="tag-pill">${langMeta(entry).flag} ${langMeta(entry).label} · ${TYPE_LABELS[entry.type]} · ${fmtDate(entry.createdAt)}</span>
        <button class="sheet-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="detail-text">${escapeHtml(entry.text)}</div>

      <div class="rings-large">${ringsSVG(stage, 54)}</div>
      <div class="stage-label">${stageLabels[stage-1]}</div>
      <div style="text-align:center; margin-bottom:6px;">
        <button class="delete-link" style="color:${entry.memorized?'var(--sage-dark)':'var(--ink-soft)'}; text-decoration:none;" onclick="toggleDetailMemorized('${entry.id}')">${entry.memorized ? '✓ 암기 완료로 표시됨 (탭해서 해제)' : '탭해서 암기 완료로 표시'}</button>
      </div>

      <div class="audio-row">
        <button class="round-btn" onclick="speak('${escapeAttr(entry.text)}', '${langMeta(entry).code}')" title="발음 듣기">🔊</button>
        <button class="round-btn rec ${state.isRecording?'recording':''}" onclick="${state.isRecording ? 'stopRecording()' : 'startRecording()'}" title="내 발음 녹음">${state.isRecording ? '■' : '●'}</button>
        <div class="audio-status">${state.isRecording ? '녹음 중...' : (entry.recording ? '내 발음이 저장되어 있어요' : '아직 녹음 전이에요')}</div>
      </div>
      ${entry.recording ? `<audio controls src="${entry.recording}"></audio>` : ''}

      <div class="section-block">
        <div class="section-title">뜻</div>
        <input class="meaning-edit" value="${escapeAttr(entry.meaning||'')}" placeholder="한국어 뜻을 적어보세요"
          onblur="handleMeaningEdit('${entry.id}', this.value)">
      </div>

      <div class="section-block">
        <div class="section-title">살 붙이기 · 예문 &amp; 메모</div>
        ${(entry.notes||[]).map(n => `
          <div class="note-item">
            ${escapeHtml(n.text)}
            <span class="note-date">${fmtDate(n.createdAt)}</span>
          </div>
        `).join('') || '<div style="font-size:12.5px;color:var(--ink-soft);">아직 추가된 예문이나 메모가 없어요.</div>'}
        <div class="add-note-row">
          <input id="noteInput" placeholder="예문, 뉘앙스, 유의어 등을 적어보세요" onkeydown="if(event.key==='Enter') handleAddNote('${entry.id}')">
          <button onclick="handleAddNote('${entry.id}')">추가</button>
        </div>
      </div>

      <div class="danger-zone">
        <button class="delete-link" onclick="handleDeleteEntry('${entry.id}')">이 표현 삭제하기</button>
      </div>
    </div>
  `;
}

// ---------- ESCAPE HELPERS ----------
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){
  return String(str||'').replace(/'/g, "\\'").replace(/"/g,'&quot;');
}

// ---------- TOP-LEVEL RENDER ----------
function setCaptureType(t){ state.captureType = t; render(); }

function render(){
  document.getElementById('entryCount').textContent = String(state.entries.length).padStart(3,'0');
  document.querySelectorAll('#tabBar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  document.querySelectorAll('#langTabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === state.activeLang);
  });
  const main = document.getElementById('mainView');
  if(state.loading){
    main.innerHTML = `<div class="journal-empty">불러오는 중...</div>`;
  } else if(state.tab === 'capture'){
    main.innerHTML = renderCapture();
  } else if(state.tab === 'journal'){
    main.innerHTML = renderJournal();
  } else if(state.tab === 'wordbook'){
    main.innerHTML = renderWordbook();
  }
  renderDetail();
}

document.getElementById('tabBar').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  state.tab = btn.dataset.tab;
  state.wbFlipped = false;
  render();
});

document.getElementById('langTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  state.activeLang = btn.dataset.lang;
  state.wbIndex = 0;
  state.wbFlipped = false;
  render();
});

// ---------- INIT ----------
render();
loadEntries();
</script>
</body>
</html>
