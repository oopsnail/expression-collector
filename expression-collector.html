<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표현 채집장</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F1EEE1;
  --paper-dark:#E7E0CC;
  --card:#FBF9F1;
  --ink:#26312B;
  --ink-soft:#6B7268;
  --sage:#5B7B5E;
  --sage-dark:#3E5940;
  --ochre:#C98D2E;
  --rust:#A64B3B;
  --denim:#3F6284;
  --plum:#7C4B68;
  --line:#D9D2BB;
  --white:#FFFDF7;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'IBM Plex Sans KR', sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--paper-dark) 1px, transparent 1px);
  background-size: 100% 2.2em;
  background-position: 0 5.6em;
}

#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* HEADER */
.app-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:22px 20px 14px;
  border-bottom:2px solid var(--ink);
  background:var(--paper);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{font-size:27.5px; line-height:1;}
.brand h1{
  font-family:'Fraunces', serif;
  font-size:23.5px;
  font-weight:600;
  letter-spacing:-0.01em;
}
.tagline{
  font-size:14px;
  color:var(--ink-soft);
  margin-top:2px;
}
.entry-count{
  font-family:'IBM Plex Mono', monospace;
  font-size:13.5px;
  color:var(--ink-soft);
  text-align:right;
  white-space:nowrap;
}
.entry-count span{color:var(--sage-dark); font-weight:600;}

/* LANGUAGE LANES */
.lang-tabs{
  display:flex;
  gap:5px;
  padding:10px 16px 0;
  background:var(--paper);
  overflow-x:auto;
  scrollbar-width:none;
  -ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
.lang-tabs::-webkit-scrollbar{display:none;}
.lang-tab{
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  white-space:nowrap;
  flex-shrink:0;
  padding:8px 13px 7px;
  border:1.3px solid var(--ink);
  border-bottom:none;
  border-radius:7px 7px 0 0;
  background:var(--paper-dark);
  color:var(--ink-soft);
  cursor:pointer;
  position:relative;
  top:1px;
  box-shadow:1px -1px 0 var(--line) inset;
}
.lang-tab.active{
  background:var(--card);
  color:var(--ink);
  font-weight:600;
}
.lang-tab.active[data-lang="en"]{box-shadow:inset 0 3px 0 0 var(--sage-dark);}
.lang-tab.active[data-lang="ja"]{box-shadow:inset 0 3px 0 0 var(--rust);}
.lang-tab.active[data-lang="es"]{box-shadow:inset 0 3px 0 0 var(--ochre);}
.lang-tab.active[data-lang="zh"]{box-shadow:inset 0 3px 0 0 var(--denim);}
.lang-tab.active[data-lang="it"]{box-shadow:inset 0 3px 0 0 var(--plum);}
.lang-tab-strip{
  height:1.5px;
  background:var(--ink);
  margin:0 0 0;
}
.lang-pill{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.02em;
  padding:2px 7px;
  border-radius:10px;
  border:1px solid var(--line);
  color:var(--ink-soft);
}

/* MAIN */
main{flex:1; padding:18px 16px 100px; overflow-y:auto;}

/* TAB BAR */
.tab-bar{
  position:fixed;
  bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:520px;
  display:flex;
  background:var(--white);
  border-top:2px solid var(--ink);
  z-index:20;
}
.tab-bar button{
  flex:1;
  padding:13px 0 11px;
  background:none; border:none;
  font-family:'IBM Plex Mono', monospace;
  font-size:15px;
  letter-spacing:0.02em;
  color:var(--ink-soft);
  cursor:pointer;
  border-top:2px solid transparent;
  margin-top:-2px;
  transition:color .15s;
}
.tab-bar button.active{
  color:var(--sage-dark);
  font-weight:600;
  border-top-color:var(--sage-dark);
}

/* CAPTURE FORM */
.capture-card{
  background:var(--card);
  border:1.5px solid var(--ink);
  border-radius:2px;
  padding:20px 18px;
  box-shadow:3px 3px 0 var(--line);
}
.field-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  letter-spacing:0.06em;
  color:var(--sage-dark);
  text-transform:uppercase;
  margin-bottom:6px;
  display:block;
}
textarea.main-input{
  width:100%;
  font-family:'Fraunces', serif;
  font-size:20.5px;
  font-weight:500;
  line-height:1.4;
  border:none;
  border-bottom:1.5px solid var(--line);
  background:transparent;
  resize:none;
  padding:4px 0 10px;
  color:var(--ink);
}
textarea.main-input:focus{outline:none; border-bottom-color:var(--sage-dark);}
.type-row{display:flex; gap:8px; margin:16px 0 14px;}
.type-chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  padding:6px 12px;
  border:1.3px solid var(--ink);
  border-radius:20px;
  background:var(--white);
  cursor:pointer;
  color:var(--ink-soft);
}
.type-chip.active{background:var(--sage-dark); color:var(--white); border-color:var(--sage-dark);}
input.meaning-input{
  width:100%;
  font-family:'IBM Plex Sans KR', sans-serif;
  font-size:16.5px;
  border:none;
  border-bottom:1.5px solid var(--line);
  background:transparent;
  padding:6px 0 8px;
  color:var(--ink);
  margin-bottom:18px;
}
input.meaning-input:focus{outline:none; border-bottom-color:var(--sage-dark);}
.save-btn{
  width:100%;
  padding:13px 0;
  background:var(--sage-dark);
  color:var(--white);
  border:none;
  border-radius:2px;
  font-family:'IBM Plex Sans KR', sans-serif;
  font-weight:600;
  font-size:16.5px;
  cursor:pointer;
  touch-action:manipulation;
}
.save-btn:active{transform:translateY(1px);}
.save-btn:disabled{background:var(--ink-soft); cursor:not-allowed;}

.hint-box{
  margin-top:16px;
  font-size:14.5px;
  color:var(--ink-soft);
  line-height:1.6;
  padding:12px 14px;
  border-left:2px solid var(--ochre);
  background:rgba(201,141,46,0.07);
}

/* JOURNAL LIST */
.journal-empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-soft);
  font-size:15.5px;
  line-height:1.7;
}
.entry-swipe-wrap{
  position:relative;
  overflow:hidden;
  border-radius:2px;
  margin-bottom:12px;
}
.entry-swipe-delete{
  position:absolute;
  top:0; right:0; bottom:0;
  width:84px;
  background:var(--rust);
  color:var(--white);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  cursor:pointer;
}
.entry-swipe-delete span:first-child{font-size:19.5px;}
.entry-swipe-delete span:last-child{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  letter-spacing:0.03em;
}
.entry-card{
  background:var(--card);
  border:1.3px solid var(--ink);
  border-radius:2px;
  padding:14px 14px 12px;
  cursor:pointer;
  box-shadow:2px 2px 0 var(--line);
  position:relative;
  z-index:1;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}
.entry-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.entry-text{
  font-family:'Fraunces', serif;
  font-size:18.5px;
  font-weight:500;
  line-height:1.35;
}
.entry-meta{
  display:flex; align-items:center; gap:8px;
  margin-top:8px;
}
.tag-pill{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.04em;
  padding:2px 7px;
  border-radius:10px;
  border:1px solid var(--line);
  color:var(--ink-soft);
  text-transform:uppercase;
}
.entry-meaning{
  font-size:15px;
  color:var(--ink-soft);
  margin-top:6px;
}

/* GROWTH RINGS */
.rings{flex-shrink:0;}
.rings svg{display:block;}

/* WORDBOOK */
.wb-controls{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px;
}
.wb-filter{
  font-family:'IBM Plex Mono', monospace;
  font-size:13.5px;
  color:var(--ink-soft);
}
.wb-progress{
  font-family:'IBM Plex Mono', monospace;
  font-size:13.5px;
  color:var(--sage-dark);
}
.flashcard{
  background:var(--card);
  border:1.5px solid var(--ink);
  border-radius:3px;
  min-height:220px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:30px 22px;
  text-align:center;
  box-shadow:4px 4px 0 var(--line);
  cursor:pointer;
  position:relative;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}
.flashcard .tag-pill{position:absolute; top:12px; left:12px;}
.fc-front{
  font-family:'Fraunces', serif;
  font-size:24.5px;
  font-weight:600;
  line-height:1.4;
}
.fc-back{
  font-size:17px;
  color:var(--sage-dark);
  font-weight:600;
  line-height:1.6;
}
.fc-hint{
  margin-top:16px;
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  color:var(--ink-soft);
}
.wb-secondary-row{display:flex; justify-content:center; gap:14px; margin-top:20px;}
.verdict-bar{
  display:flex;
  align-items:stretch;
  margin-top:14px;
  border:1.5px solid var(--ink);
  border-radius:4px;
  overflow:hidden;
  box-shadow:3px 3px 0 var(--line);
}
.verdict-half{
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:5px;
  padding:16px 0 13px;
  border:none;
  cursor:pointer;
  background:var(--white);
  transition:background .12s, transform .1s;
}
.verdict-half:active{transform:translateY(1px);}
.verdict-half.not-yet{color:var(--rust);}
.verdict-half.not-yet:hover{background:rgba(166,75,59,0.07);}
.verdict-half.got-it{color:var(--sage-dark);}
.verdict-half.got-it:hover{background:rgba(91,123,94,0.07);}
.verdict-icon{
  width:26px; height:26px;
  border-radius:50%;
  border:1.5px solid currentColor;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces', serif;
  font-size:16px;
  font-weight:600;
}
.verdict-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  letter-spacing:0.05em;
  text-transform:uppercase;
}
.verdict-divider{width:1.5px; background:var(--ink);}
.memorized-pill{
  position:absolute; top:12px; right:12px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  padding:3px 8px;
  border-radius:10px;
  letter-spacing:0.03em;
}
.memorized-pill.yes{background:rgba(91,123,94,0.14); color:var(--sage-dark); border:1px solid var(--sage-dark);}
.memorized-pill.no{background:rgba(166,75,59,0.1); color:var(--rust); border:1px solid var(--rust);}
.entry-check{
  font-size:15.5px;
  margin-top:8px;
}

/* OVERLAY / DETAIL */
.overlay{
  position:fixed; inset:0;
  background:rgba(38,49,43,0.45);
  z-index:50;
  display:flex; align-items:flex-end;
  max-width:520px; margin:0 auto;
}
.overlay.hidden{display:none;}
.sheet{
  background:var(--paper);
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  border-radius:14px 14px 0 0;
  border-top:2px solid var(--ink);
  padding:18px 18px 30px;
  animation:slideUp .18s ease-out;
}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
.sheet-close{
  background:none; border:none; font-size:21.5px; color:var(--ink-soft); cursor:pointer; padding:2px 6px;
}
.detail-text{
  font-family:'Fraunces', serif;
  font-size:25.5px;
  font-weight:600;
  line-height:1.35;
  margin-bottom:6px;
}
.audio-row{display:flex; gap:10px; margin:16px 0;}
.round-btn{
  width:46px; height:46px;
  border-radius:50%;
  border:1.5px solid var(--ink);
  background:var(--white);
  font-size:19.5px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.round-btn.rec{border-color:var(--rust); color:var(--rust);}
.round-btn.rec.recording{background:var(--rust); color:var(--white); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(166,75,59,0.4);} 50%{box-shadow:0 0 0 8px rgba(166,75,59,0);}}
.audio-status{
  font-family:'IBM Plex Mono', monospace;
  font-size:13.5px;
  color:var(--ink-soft);
  display:flex; align-items:center;
}
audio{height:36px; max-width:100%;}

.section-block{margin-top:20px;}
.section-title{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  letter-spacing:0.06em;
  color:var(--sage-dark);
  text-transform:uppercase;
  margin-bottom:8px;
  display:flex; align-items:center; gap:8px;
}
.section-title::after{content:''; flex:1; height:1px; background:var(--line);}
.meaning-edit{
  width:100%;
  font-size:16.5px;
  border:none;
  border-bottom:1.5px solid var(--line);
  background:transparent;
  padding:6px 0;
}
.meaning-edit:focus{outline:none; border-bottom-color:var(--sage-dark);}

.note-item{
  background:var(--card);
  border:1px solid var(--line);
  border-left:3px solid var(--ochre);
  padding:10px 12px;
  border-radius:2px;
  margin-bottom:8px;
  font-size:15.5px;
  line-height:1.5;
}
.note-date{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--ink-soft);
  margin-top:4px;
  display:block;
}
.add-note-row{display:flex; gap:8px; margin-top:6px;}
.add-note-row input{
  flex:1;
  font-size:15.5px;
  border:1.3px solid var(--line);
  border-radius:2px;
  padding:9px 10px;
  background:var(--white);
}
.add-note-row input:focus{outline:none; border-color:var(--sage-dark);}
.add-note-row button{
  padding:0 16px;
  border:1.3px solid var(--ink);
  background:var(--ink);
  color:var(--white);
  border-radius:2px;
  font-size:15.5px;
  cursor:pointer;
}

.rings-large{display:flex; justify-content:center; margin:6px 0 4px;}
.stage-label{
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  color:var(--ink-soft);
  margin-bottom:10px;
}

.danger-zone{margin-top:26px; text-align:center;}
.delete-link{
  background:none; border:none;
  color:var(--rust);
  font-size:14.5px;
  font-family:'IBM Plex Mono', monospace;
  cursor:pointer;
  text-decoration:underline;
}

.toast{
  position:fixed; bottom:76px; left:50%; transform:translateX(-50%) scale(0.9);
  background:var(--ink); color:var(--white);
  padding:12px 22px; border-radius:24px;
  font-size:15.5px;
  font-weight:600;
  border:1.5px solid var(--sage-dark);
  box-shadow:0 6px 16px rgba(38,49,43,0.28);
  z-index:100;
  opacity:0; pointer-events:none;
  transition:opacity .18s, transform .18s cubic-bezier(.34,1.56,.64,1);
  max-width:86%;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.toast.show{opacity:1; transform:translateX(-50%) scale(1);}

@keyframes countPulse{
  0%{transform:scale(1); color:var(--sage-dark);}
  40%{transform:scale(1.5); color:var(--ochre);}
  100%{transform:scale(1); color:var(--sage-dark);}
}
.entry-count span.pulse{display:inline-block; animation:countPulse .5s ease;}

.save-btn.saved{
  background:var(--sage-dark);
  animation:saveBounce .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes saveBounce{
  0%{transform:scale(1);}
  35%{transform:scale(1.035);}
  100%{transform:scale(1);}
}
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">🌿</span>
      <div>
        <h1>표현 채집장</h1>
        <p class="tagline">좋은 문장을 채집하고, 천천히 살을 붙여보세요</p>
      </div>
    </div>
    <div class="entry-count">No. <span id="entryCount">000</span></div>
  </header>
  <nav class="lang-tabs" id="langTabs">
    <button class="lang-tab" data-lang="en">영어</button>
    <button class="lang-tab" data-lang="ja">일본어</button>
    <button class="lang-tab" data-lang="es">스페인어</button>
    <button class="lang-tab" data-lang="zh">중국어</button>
    <button class="lang-tab" data-lang="it">이탈리아어</button>
  </nav>
  <div class="lang-tab-strip"></div>
  <main id="mainView"></main>
  <nav class="tab-bar" id="tabBar">
    <button data-tab="capture">채집</button>
    <button data-tab="journal">노트</button>
    <button data-tab="wordbook">단어장</button>
  </nav>
</div>
<div id="detailOverlay" class="overlay hidden"></div>
<div id="toast" class="toast"></div>

<script>
// ---------- STATE ----------
let state = {
  tab: 'capture',
  entries: [],
  loading: true,
  captureType: 'expression',
  activeLang: 'en',
  draftText: '',
  draftMeaning: '',
  wbIndex: 0,
  wbFlipped: false,
  wbFilter: 'all',
  wbStatusFilter: 'all',
  detailId: null,
  isRecording: false,
};
let mediaRecorder = null;
let recChunks = [];

const TYPE_LABELS = { word: '단어', expression: '표현', sentence: '문장' };
const LANG_META = {
  en: { label: '영어', color: 'var(--sage-dark)', code: 'en-US' },
  ja: { label: '일본어', color: 'var(--rust)', code: 'ja-JP' },
  es: { label: '스페인어', color: 'var(--ochre)', code: 'es-ES' },
  zh: { label: '중국어', color: 'var(--denim)', code: 'zh-CN' },
  it: { label: '이탈리아어', color: 'var(--plum)', code: 'it-IT' },
};
function langMeta(entry){ return LANG_META[entry.lang] || LANG_META.en; }

// ---------- STORAGE BACKEND (Claude artifact storage, with localStorage fallback) ----------
let storageBackend = null; // 'claude' | 'local' | 'memory'

async function detectStorageBackend(){
  // Try Claude's artifact storage first (only available inside claude.ai's preview panel)
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      const testKey = '__storage_test__';
      await window.storage.set(testKey, '1', false);
      const r = await window.storage.get(testKey, false);
      if(r && r.value === '1'){
        await window.storage.delete(testKey, false);
        storageBackend = 'claude';
        return;
      }
    }
  }catch(e){ /* fall through */ }

  // Fall back to the browser's own localStorage (works when the file is opened
  // directly in Safari/Chrome instead of inside Claude's chat).
  try{
    const testKey = '__storage_test__';
    localStorage.setItem(testKey, '1');
    const ok = localStorage.getItem(testKey) === '1';
    localStorage.removeItem(testKey);
    if(ok){ storageBackend = 'local'; return; }
  }catch(e){ /* fall through */ }

  storageBackend = 'memory';
}

function lsListKeys(prefix){
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(prefix)) keys.push(k);
  }
  return keys;
}

async function storageSet(key, value){
  if(storageBackend === 'claude'){
    return await window.storage.set(key, value, false);
  }
  if(storageBackend === 'local'){
    localStorage.setItem(key, value);
    return { key, value };
  }
  memoryStore[key] = value; // memory-only fallback, lost on refresh
  return { key, value };
}
async function storageGet(key){
  if(storageBackend === 'claude'){
    return await window.storage.get(key, false);
  }
  if(storageBackend === 'local'){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return { key, value: v };
  }
  if(!(key in memoryStore)) throw new Error('not found');
  return { key, value: memoryStore[key] };
}
async function storageDelete(key){
  if(storageBackend === 'claude'){
    return await window.storage.delete(key, false);
  }
  if(storageBackend === 'local'){
    localStorage.removeItem(key);
    return { key, deleted: true };
  }
  delete memoryStore[key];
  return { key, deleted: true };
}
async function storageListKeys(prefix){
  if(storageBackend === 'claude'){
    const r = await window.storage.list(prefix, false);
    return (r && r.keys) ? r.keys : [];
  }
  if(storageBackend === 'local'){
    return lsListKeys(prefix);
  }
  return Object.keys(memoryStore).filter(k=>k.startsWith(prefix));
}
const memoryStore = {};

// ---------- STORAGE HELPERS ----------
async function loadEntries(){
  if(!storageBackend) await detectStorageBackend();
  try{
    const keys = await storageListKeys('entry:');
    const results = [];
    for(const k of keys){
      try{
        const r = await storageGet(k);
        if(r && r.value) results.push(JSON.parse(r.value));
      }catch(e){ /* skip broken key */ }
    }
    results.sort((a,b)=> b.createdAt - a.createdAt);
    state.entries = results;
  }catch(e){
    console.error('load error', e);
    showToast('⚠️ 저장된 데이터를 불러오지 못했어요');
  }
  state.loading = false;
  render();
  if(storageBackend === 'local'){
    showToast('💾 이 브라우저에 저장 중이에요 (기기별로 따로 저장돼요)');
  } else if(storageBackend === 'memory'){
    showToast('⚠️ 저장이 지원되지 않는 환경이에요. 자주 내보내기 해주세요');
  }
}

async function saveEntry(entry){
  try{
    const r = await storageSet('entry:' + entry.id, JSON.stringify(entry));
    if(!r) showToast('⚠️ 저장이 확인되지 않았어요. 내보내기로 백업해두세요');
    return r;
  }catch(e){
    console.error('save error', e);
    showToast('⚠️ 저장에 실패했어요. 내보내기로 백업해두세요');
    return null;
  }
}

async function deleteEntryStorage(id){
  try{
    await storageDelete('entry:' + id);
  }catch(e){
    console.error('delete error', e);
    showToast('⚠️ 삭제 반영에 실패했어요');
  }
}

// ---------- UTIL ----------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}
function stageOf(entry){
  let s = 1;
  if(entry.meaning && entry.meaning.trim()) s = 2;
  if(entry.notes && entry.notes.length > 0) s = 3;
  if(entry.recording) s = 4;
  return s;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}
function ringsSVG(stage, size){
  size = size || 34;
  const c = size/2;
  const colors = ['#D9D2BB', '#C98D2E', '#5B7B5E', '#26312B'];
  let circles = '';
  for(let i=0;i<4;i++){
    const r = 3 + i*4.2;
    const filled = i < stage;
    circles += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${filled?colors[i]:'#E7E0CC'}" stroke-width="${filled?2:1}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>`;
}

function speak(text, langCode){
  if(!('speechSynthesis' in window)){ showToast('이 브라우저는 음성 합성을 지원하지 않아요'); return; }
  langCode = langCode || 'en-US';
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langCode;
  u.rate = 0.92;
  const voices = speechSynthesis.getVoices();
  const prefix = langCode.split('-')[0];
  const match = voices.find(v=>v.lang && v.lang.startsWith(prefix));
  if(match) u.voice = match;
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{};
}

// ---------- RECORDING ----------
function pickRecordingMimeType(){
  if(typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
  const candidates = [
    'audio/mp4',              // Safari
    'audio/webm;codecs=opus', // Chrome/Firefox/Edge
    'audio/webm',
    'audio/ogg;codecs=opus',
  ];
  for(const type of candidates){
    if(MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}

async function startRecording(){
  if(!(window.isSecureContext)){
    showToast('⚠️ 보안 연결(https)이 아니라서 마이크를 쓸 수 없어요. Claude 대화창 안에서 열어주세요');
    return;
  }
  if(!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function'){
    showToast('⚠️ 이 브라우저/환경에서는 마이크 녹음이 지원되지 않아요');
    return;
  }
  if(typeof MediaRecorder === 'undefined'){
    showToast('⚠️ 이 브라우저는 녹음 기능(MediaRecorder)을 지원하지 않아요');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    const mimeType = pickRecordingMimeType();
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    const actualType = mediaRecorder.mimeType || mimeType || 'audio/webm';
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recChunks, { type: actualType });
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result;
        const entry = state.entries.find(e=>e.id === state.detailId);
        if(entry){
          entry.recording = base64;
          await saveEntry(entry);
          render();
          showToast('녹음이 저장되었어요');
        }
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start(250);
    state.isRecording = true;
    render();
  }catch(err){
    console.error('recording error', err);
    if(err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')){
      showToast('⚠️ 마이크 접근이 거부됐어요. 브라우저 설정에서 마이크 권한을 허용해주세요');
    } else if(err && err.name === 'NotFoundError'){
      showToast('⚠️ 사용 가능한 마이크를 찾을 수 없어요');
    } else {
      showToast('⚠️ 녹음을 시작할 수 없어요: ' + (err && err.message ? err.message : '알 수 없는 오류'));
    }
  }
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder.stop();
  }
  state.isRecording = false;
  render();
}

// ---------- ACTIONS ----------
async function handleAddEntry(){
  const text = state.draftText.trim();
  if(!text) return;

  // Close the mobile keyboard first — triggering effects while it's still
  // animating shut can cause them to be skipped or clipped on some mobile browsers.
  if(document.activeElement && typeof document.activeElement.blur === 'function'){
    document.activeElement.blur();
  }

  const entry = {
    id: uid(),
    text,
    type: state.captureType,
    lang: state.activeLang,
    meaning: state.draftMeaning.trim(),
    notes: [],
    recording: null,
    memorized: false,
    createdAt: Date.now(),
  };
  state.entries.unshift(entry);
  await saveEntry(entry);
  state.draftText = '';
  state.draftMeaning = '';
  render();

  const runEffects = () => {
    const preview = text.length > 26 ? text.slice(0, 26) + '…' : text;
    showToast(`🌱 “${preview}” 채집 완료!`);

    const btn = document.getElementById('saveBtn');
    if(btn){
      const original = '채집장에 담기';
      btn.textContent = '✓ 채집 완료!';
      btn.classList.add('saved');
      btn.disabled = true;
      setTimeout(()=>{
        btn.textContent = original;
        btn.classList.remove('saved');
        btn.disabled = false;
      }, 1100);
    }
    const countEl = document.getElementById('entryCount');
    if(countEl){
      countEl.classList.remove('pulse');
      void countEl.offsetWidth; // restart animation
      countEl.classList.add('pulse');
    }
  };

  // Double rAF: wait for the keyboard-close reflow + our own render() to fully
  // settle before starting the animations, so they aren't dropped on mobile.
  requestAnimationFrame(() => requestAnimationFrame(runEffects));
}

async function handleDeleteEntry(id){
  if(!confirm('이 표현을 삭제할까요? 되돌릴 수 없어요.')) return;
  state.entries = state.entries.filter(e=>e.id !== id);
  await deleteEntryStorage(id);
  closeDetail();
  render();
}

async function handleAddNote(id){
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if(!text) return;
  const entry = state.entries.find(e=>e.id === id);
  if(!entry) return;
  entry.notes = entry.notes || [];
  entry.notes.push({ id: uid(), text, createdAt: Date.now() });
  await saveEntry(entry);
  input.value = '';
  render();
}

async function handleMeaningEdit(id, value){

  else if(state.wbStatusFilter === 'memorized') list = list.filter(e=>e.memorized);
  if(state.wbFilter !== 'all') list = list.filter(e=>e.type === state.wbFilter);
  return list;

      </div>

      <div class="danger-zone">
        <button class="delete-link" onclick="handleDeleteEntry('${entry.id}')">이 표현 삭제하기</button>
      </div>
    </div>
  `;
}

// ---------- ESCAPE HELPERS ----------
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){
  return String(str||'').replace(/'/g, "\\'").replace(/"/g,'&quot;');
}

// ---------- TOP-LEVEL RENDER ----------
function setCaptureType(t){ state.captureType = t; render(); }

function render(){
  document.getElementById('entryCount').textContent = String(state.entries.length).padStart(3,'0');
  document.querySelectorAll('#tabBar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  document.querySelectorAll('#langTabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === state.activeLang);
  });
  const main = document.getElementById('mainView');
  if(state.loading){
    main.innerHTML = `<div class="journal-empty">불러오는 중...</div>`;
  } else if(state.tab === 'capture'){
    main.innerHTML = renderCapture();
  } else if(state.tab === 'journal'){
    main.innerHTML = renderJournal();
  } else if(state.tab === 'wordbook'){
    main.innerHTML = renderWordbook();
  }
  renderDetail();
}

document.getElementById('tabBar').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  state.tab = btn.dataset.tab;
  state.wbFlipped = false;
  render();
});

document.getElementById('langTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  state.activeLang = btn.dataset.lang;
  state.wbIndex = 0;
  state.wbFlipped = false;
  render();
});

// ---------- GESTURES: swipe-to-delete (journal) + swipe-to-navigate (wordbook) ----------
let gesture = { type:null, el:null, startX:0, startY:0, baseX:0, currentX:0, dragging:false, moved:false, horizontal:false };

function resetSwipes(exceptId){
  document.querySelectorAll('.entry-card.swiped').forEach(el=>{
    if(el.dataset.id !== exceptId){
      el.classList.remove('swiped');
      el.style.transition = 'transform .2s ease';
      el.style.transform = 'translateX(0)';
    }
  });
}

const mainViewEl = document.getElementById('mainView');

mainViewEl.addEventListener('pointerdown', (e)=>{
  if(e.target.closest('.entry-swipe-delete')) return;
  const entryCard = e.target.closest('.entry-card');
  const flashcard = e.target.closest('.flashcard');
  if(entryCard){
    resetSwipes(entryCard.dataset.id);
    gesture.type = 'entry';
    gesture.el = entryCard;
    gesture.startX = e.clientX;
    gesture.startY = e.clientY;
    gesture.baseX = entryCard.classList.contains('swiped') ? -84 : 0;
    gesture.currentX = gesture.baseX;
    gesture.dragging = true;
    gesture.moved = false;
    gesture.horizontal = false;
    entryCard.style.transition = 'none';
  } else if(flashcard){
    gesture.type = 'flashcard';
    gesture.el = flashcard;
    gesture.startX = e.clientX;
    gesture.startY = e.clientY;
    gesture.baseX = 0;
    gesture.currentX = 0;
    gesture.dragging = true;
    gesture.moved = false;
    gesture.horizontal = false;
    flashcard.style.transition = 'none';
  }
});

mainViewEl.addEventListener('pointermove', (e)=>{
  if(!gesture.dragging || !gesture.el) return;
  const dx = e.clientX - gesture.startX;
  const dy = e.clientY - gesture.startY;
  if(!gesture.horizontal){
    if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    if(Math.abs(dy) > Math.abs(dx)){
      gesture.dragging = false;
      gesture.el = null;
      return;
    }
    gesture.horizontal = true;
  }
  gesture.moved = true;
  if(gesture.type === 'entry'){
    const next = Math.min(0, Math.max(gesture.baseX + dx, -96));
    gesture.currentX = next;
    gesture.el.style.transform = `translateX(${next}px)`;
  } else if(gesture.type === 'flashcard'){
    gesture.currentX = dx;
    gesture.el.style.transform = `translateX(${dx}px) rotate(${(dx/24).toFixed(2)}deg)`;
    gesture.el.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx)/280));
  }
});

function endGesture(){
  if(!gesture.el){ gesture.dragging = false; return; }
  gesture.dragging = false;
  const el = gesture.el;
  const type = gesture.type;
  const currentX = gesture.currentX;
  gesture.el = null;

  if(type === 'entry'){
    el.style.transition = 'transform .2s ease';
    if(currentX < -40){
      el.style.transform = 'translateX(-84px)';
      el.classList.add('swiped');
    } else {
      el.style.transform = 'translateX(0)';
      el.classList.remove('swiped');
    }
  } else if(type === 'flashcard'){
    const threshold = 70;
    el.style.transition = 'transform .2s ease, opacity .2s ease';
    if(currentX < -threshold){
      el.style.transform = 'translateX(-340px) rotate(-12deg)';
      el.style.opacity = '0';
      setTimeout(wbNext, 150);
    } else if(currentX > threshold){
      el.style.transform = 'translateX(340px) rotate(12deg)';
      el.style.opacity = '0';
      setTimeout(wbPrev, 150);
    } else {
      el.style.transform = 'translateX(0) rotate(0deg)';
      el.style.opacity = '1';
    }
  }
}
mainViewEl.addEventListener('pointerup', endGesture);
mainViewEl.addEventListener('pointercancel', endGesture);

mainViewEl.addEventListener('click', (e)=>{
  if(e.target.closest('.entry-swipe-delete')) return;
  const entryCard = e.target.closest('.entry-card');
  if(entryCard){
    if(gesture.moved){ gesture.moved = false; return; }
    if(entryCard.classList.contains('swiped')){
      entryCard.classList.remove('swiped');
      entryCard.style.transition = 'transform .2s ease';
      entryCard.style.transform = 'translateX(0)';
      return;
    }
    openDetail(entryCard.dataset.id);
    return;
  }
  const flashcard = e.target.closest('.flashcard');
  if(flashcard){
    if(gesture.moved){ gesture.moved = false; return; }
    toggleFlip();
  }
});

document.addEventListener('click', (e)=>{
  if(e.target.closest('.entry-card') || e.target.closest('.entry-swipe-delete')) return;
  resetSwipes(null);
});

// ---------- INIT ----------
render();
loadEntries();
</script>
